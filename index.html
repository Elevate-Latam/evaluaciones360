<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elevate · Evaluación 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --teal-900:#213f43;
  --teal-700:#3d6b72;
  --teal-500:#4b747b;
  --teal-200:#cfe0e0;
  --teal-100:#e8f0f0;
  --teal-50:#f4f8f8;
  --terra-600:#b0421c;
  --terra-500:#c0572f;
  --terra-100:#f5e6e0;
  --taupe-700:#4a423d;
  --taupe-500:#645851;
  --taupe-300:#a89e97;
  --taupe-100:#ece7e2;
  --bg:#f6f5f2;
  --surface:#ffffff;
  --ink:#25231f;
  --ink-soft:#5b5650;
  --line:#e4e0da;
  --ok:#3f8f5f;
  --ok-soft:#7fb069;
  --warn:#dba13a;
  --bad:#c9503d;
  --radius:14px;
  --shadow: 0 1px 2px rgba(37,35,31,.06), 0 8px 24px -12px rgba(37,35,31,.15);
  --font-display:'Manrope',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;color:var(--teal-900);margin:0 0 4px;letter-spacing:-0.01em;}
p{margin:0 0 8px;color:var(--ink-soft);line-height:1.5;}
a{color:var(--teal-700);}
button{font-family:var(--font-body);cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
#app{min-height:100vh;}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;}
.sidebar{
  width:240px;flex:none;background:linear-gradient(180deg,var(--teal-900),#183034);
  color:#dfeaea;display:flex;flex-direction:column;padding:22px 16px;
}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 6px;}
.brand img{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#fff;padding:3px;}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:15px;color:#fff;line-height:1.1;}
.brand-sub{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-200);opacity:.8;}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:#c9dbdb;text-decoration:none;font-size:13.5px;font-weight:600;border:none;background:none;text-align:left;width:100%;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:var(--terra-500);opacity:0;}
.nav-item.active .nav-dot{opacity:1;}
.nav-sep{height:1px;background:rgba(255,255,255,.08);margin:12px 4px;}
.client-picker{margin:6px 0 18px;padding:0 2px;}
.client-picker label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal-200);opacity:.75;margin-bottom:6px;}
.client-picker select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:8px 10px;border-radius:9px;font-size:13px;}
.sidebar-foot{font-size:11.5px;color:var(--teal-200);opacity:.65;padding:10px 6px 0;border-top:1px solid rgba(255,255,255,.08);}
.logout-btn{margin-top:8px;background:none;border:1px solid rgba(255,255,255,.18);color:#dfeaea;padding:8px 10px;border-radius:9px;font-size:12.5px;width:100%;}
.logout-btn:hover{background:rgba(255,255,255,.08);}

.main{flex:1;min-width:0;padding:34px 40px 60px;max-width:1180px;}
.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:16px;flex-wrap:wrap;}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--terra-600);font-weight:700;margin-bottom:6px;}
.page-title{font-size:26px;}
.page-desc{max-width:560px;}

.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700;transition:transform .05s ease;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal-700);color:#fff;}
.btn-primary:hover{background:var(--teal-900);}
.btn-ghost{background:var(--teal-50);color:var(--teal-900);border:1px solid var(--teal-200);}
.btn-ghost:hover{background:var(--teal-100);}
.btn-terra{background:var(--terra-600);color:#fff;}
.btn-terra:hover{background:#8f3416;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn-danger{background:#fff;color:var(--bad);border:1px solid #f0c9c2;}
.btn-danger:hover{background:#fdf2f0;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);}
.card + .card{margin-top:16px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--taupe-700);margin-bottom:5px;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;background:#fdfcfb;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal-200);border-color:var(--teal-500);}
.field-hint{font-size:11.5px;color:var(--taupe-300);margin-top:4px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--taupe-500);padding:8px 10px;border-bottom:1px solid var(--line);}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.empty-state{padding:34px 10px;text-align:center;color:var(--taupe-300);}
.empty-state svg{opacity:.5;margin-bottom:10px;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;}
.badge-ok{background:#e7f3ea;color:var(--ok);}
.badge-warn{background:#fbf1de;color:#a5741f;}
.badge-bad{background:#fbe9e6;color:var(--bad);}
.badge-neutral{background:var(--taupe-100);color:var(--taupe-700);}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.tab{padding:10px 16px;font-size:13px;font-weight:700;color:var(--taupe-500);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--teal-900);border-bottom-color:var(--terra-600);}

.modal-overlay{position:fixed;inset:0;background:rgba(33,63,67,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;z-index:50;overflow:auto;}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal h3{margin-bottom:14px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--teal-50);border:1px solid var(--teal-200);color:var(--teal-900);padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;}

/* login + eval screens */
.center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 15% 20%, var(--teal-100), transparent 45%),
  radial-gradient(circle at 85% 80%, var(--terra-100), transparent 40%),
  var(--bg);
  padding:24px;
}
.auth-card{background:#fff;border-radius:20px;box-shadow:0 24px 70px -20px rgba(33,63,67,.35);padding:38px 36px;width:100%;max-width:400px;border:1px solid var(--line);}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.auth-logo img{width:40px;height:40px;object-fit:contain;}
.auth-title{font-size:19px;}
.auth-foot{margin-top:18px;font-size:12px;color:var(--taupe-300);text-align:center;}

.seed-note{background:var(--terra-100);border:1px solid #e7c3b3;color:#7a3115;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:14px;line-height:1.5;}

/* semaphore */
.sema{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-weight:800;font-size:12px;color:#fff;}
.sema-1{background:#c9503d;}
.sema-2{background:#dba13a;}
.sema-3{background:#7fb069;}
.sema-4{background:#3f8f5f;}

.report-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--teal-100);padding-bottom:18px;margin-bottom:22px;}
.report-header img{width:44px;height:44px;object-fit:contain;}
.comp-block{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
.comp-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;flex-wrap:wrap;}
.comp-name{font-weight:700;color:var(--teal-900);font-size:14.5px;}
.ancla{font-style:italic;color:var(--taupe-500);font-size:13px;margin:6px 0 8px;}
.comport-list{margin:0;padding-left:18px;font-size:13px;color:var(--ink-soft);}
.comport-list li{margin-bottom:3px;}
.group-row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line);color:var(--taupe-500);}
.bar-track{background:var(--teal-50);border-radius:99px;height:7px;overflow:hidden;margin-top:6px;}
.bar-fill{height:100%;border-radius:99px;}

.outlier-flag{display:inline-flex;align-items:center;gap:5px;color:var(--bad);font-size:11.5px;font-weight:700;background:#fbe9e6;padding:3px 8px;border-radius:8px;}

.link-box{display:flex;gap:8px;align-items:center;background:var(--teal-50);border:1px solid var(--teal-200);border-radius:9px;padding:8px 10px;font-size:12px;font-family:monospace;overflow-x:auto;white-space:nowrap;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--teal-900);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:100;font-weight:600;}

.small-muted{font-size:11.5px;color:var(--taupe-300);}
.icon-btn{background:none;border:none;color:var(--taupe-500);padding:4px;border-radius:6px;}
.icon-btn:hover{background:var(--taupe-100);}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0;}

.checklist{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px;}
.checklist-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
.checklist-row input[type=text]{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;}
.cat-heading{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--terra-600);font-weight:800;margin:16px 0 8px;}
</style>
</head>

const ELEVATE_DICT = [{"id": "colaboracion", "categoria": "A", "nombre": "Colaboración", "definicion": "Habilidad para trabajar de manera efectiva en equipo, compartiendo conocimientos y recursos, integrando diferencias y cocreando soluciones para alcanzar objetivos comunes. Implica ejercer una influencia positiva que movilice a otros desde la empatía, la apertura y el propósito compartido.", "notaDiferenciacion": "Diferenciación respecto a Empatía: Colaboración se enfoca en la dinámica grupal y la construcción conjunta de resultados. Empatía se enfoca en la comprensión emocional del individuo. Una persona puede ser colaborativa sin ser empática en profundidad, y viceversa.", "niveles": {"4": {"anclaConductual": "Diseña entornos colaborativos y gestiona tensiones entre equipos", "comportamientos": ["Media en situaciones de conflicto entre áreas o equipos con múltiples intereses, buscando soluciones equilibradas sin imponer su autoridad.", "Diseña estructuras y dinámicas de trabajo que maximizan la colaboración entre funciones distintas.", "Fomenta espacios de cocreación donde las diferencias de criterio se convierten en ventaja colectiva.", "Modela comportamientos de respeto, apertura y corresponsabilidad en todo momento."]}, "3": {"anclaConductual": "Lidera activamente hacia objetivos compartidos integrando perspectivas diversas", "comportamientos": ["Alinea a su equipo y pares hacia metas comunes, integrando visiones distintas sin imponer la propia.", "Facilita la cooperación y resuelve fricciones de trabajo dentro del equipo o con otras áreas.", "Comparte conocimiento relevante proactivamente, sin guardarlo como ventaja individual.", "Utiliza herramientas digitales de colaboración para coordinar y mantener alineación en tiempo real."]}, "2": {"anclaConductual": "Contribuye activamente al logro colectivo del equipo", "comportamientos": ["Se comunica de forma abierta y cooperativa para alcanzar objetivos compartidos.", "Aporta sus conocimientos y recursos al equipo cuando identifica que otros los necesitan.", "Cumple compromisos adquiridos con el grupo, manteniendo la confianza del equipo.", "Participa con disposición en espacios de trabajo colectivo, presenciales o digitales."]}, "1": {"anclaConductual": "Participa en el equipo siguiendo roles y normas establecidos", "comportamientos": ["Cumple su rol dentro del equipo aunque su participación en la construcción conjunta es aún limitada.", "Comparte información básica cuando se le solicita o cuando es evidente que otros la necesitan.", "Se comunica con respeto y mantiene relaciones cordiales con sus compañeros.", "Requiere guía para contribuir de manera integrada en proyectos colectivos complejos."]}}}, {"id": "comunicacion", "categoria": "A", "nombre": "Comunicación", "definicion": "Habilidad para transmitir ideas, información y emociones de manera clara y efectiva, incluyendo la escucha activa, asegurando la comprensión, la acción adecuada y la alineación con los objetivos. Implica la adaptación al interlocutor y el uso consciente del lenguaje verbal, no verbal y escrito para generar confianza e impacto en distintos contextos.", "notaDiferenciacion": "", "niveles": {"4": {"anclaConductual": "Gestiona la comunicación institucional en situaciones de alta complejidad o crisis", "comportamientos": ["Transmite mensajes clave con claridad, empatía y firmeza en contextos de urgencia, incertidumbre o crisis reputacional.", "Gestiona la comunicación interna y externa para mantener la confianza y el alineamiento organizacional.", "Actúa como referente comunicacional, orientando a otros sobre cómo comunicar en contextos difíciles.", "Influye de manera efectiva integrando contenido, emoción y lenguaje no verbal en audiencias diversas."]}, "3": {"anclaConductual": "Facilita reuniones, presenta con persuasión y adapta mensajes complejos a audiencias diversas", "comportamientos": ["Comunica con claridad y persuasión tanto en conversaciones como en presentaciones formales ante distintos niveles.", "Organiza ideas y contenidos de forma lógica, adaptando el formato y el tono según la audiencia y el contexto.", "Promueve la participación activa durante reuniones, clarificando dudas y reforzando mensajes clave.", "Utiliza recursos comunicativos variados (visuales, verbales, escritos) para reforzar el impacto y la comprensión."]}, "2": {"anclaConductual": "Se comunica de forma clara y estructurada, adaptando el mensaje al receptor", "comportamientos": ["Redacta informes, correos y reportes de forma clara, estructurada y comprensible para distintos destinatarios.", "Utiliza lenguaje verbal y no verbal apropiado al contexto, evitando ambigüedades.", "Revisa sus mensajes para asegurar coherencia, corrección y tono profesional antes de enviarlos.", "Confirma activamente que su mensaje fue comprendido en conversaciones relevantes."]}, "1": {"anclaConductual": "Comunica información básica de forma clara y respetuosa", "comportamientos": ["Se comunica de forma clara y respetuosa, cuidando el tono y el lenguaje corporal.", "Transmite datos o instrucciones básicas cuando se le solicita.", "Escucha con atención, aunque requiere apoyo para verificar comprensión o adaptar su mensaje.", "Utiliza un lenguaje directo, aunque limitado, para explicar procesos o resultados."]}}}, {"id": "enfoque-en-resultados", "categoria": "A", "nombre": "Enfoque en resultados", "definicion": "Enfoque en alcanzar objetivos específicos, estableciendo metas claras, optimizando recursos, monitoreando avances y trabajando eficientemente para lograr resultados medibles.", "notaDiferenciacion": "", "niveles": {"4": {"anclaConductual": "Supera consistentemente las expectativas y establece el estándar de productividad", "comportamientos": ["Entrega resultados sobresalientes que superan lo esperado en impacto, calidad o eficiencia.", "Establece estándares de desempeño altos y sirve como referente de productividad en su equipo u organización.", "Identifica oportunidades estratégicas que contribuyen al logro de metas organizacionales más allá de su rol.", "Promueve una cultura orientada a resultados, motivando a otros a elevar su desempeño."]}, "3": {"anclaConductual": "Supera sus objetivos de manera regular con enfoque constante en los resultados", "comportamientos": ["Supera consistentemente las metas establecidas, generando resultados de alto impacto.", "Monitorea sus avances y ajusta sus acciones de manera proactiva para maximizar el rendimiento.", "Optimiza recursos y busca continuamente formas más eficientes de lograr sus objetivos.", "Mantiene un alto nivel de compromiso con los resultados, incluso ante obstáculos o presión."]}, "2": {"anclaConductual": "Cumple con los objetivos de manera adecuada y en los plazos establecidos", "comportamientos": ["Organiza su trabajo y administra su tiempo para cumplir con las metas asignadas.", "Ejecuta sus tareas con calidad y dentro de los plazos establecidos sin necesidad de supervisión constante.", "Prioriza actividades de forma efectiva para cumplir con sus responsabilidades.", "Da seguimiento a sus objetivos y ajusta su esfuerzo cuando identifica desvíos."]}, "1": {"anclaConductual": "Alcanza parcialmente sus objetivos con apoyo y supervisión", "comportamientos": ["Cumple sus tareas básicas, aunque no siempre logra los objetivos esperados o lo hace de forma irregular.", "Presenta dificultades para priorizar, organizarse o cumplir con plazos establecidos.", "Requiere supervisión frecuente para mantenerse enfocado en las metas y finalizar su trabajo con calidad."]}}}, {"id": "integridad-y-etica-profesional", "categoria": "A", "nombre": "Integridad y ética profesional", "definicion": "Capacidad para actuar con honestidad, transparencia y coherencia entre los valores personales y el comportamiento profesional, incluso bajo presión, conflictos de interés o situaciones donde la acción ética tiene un costo personal o institucional.", "notaDiferenciacion": "Diferenciación respecto a Gestión del riesgo: esta competencia aborda la dimensión ética y de integridad personal; Gestión del riesgo aborda la identificación y mitigación de riesgos operativos.", "niveles": {"4": {"anclaConductual": "Es referente ético y diseña mecanismos que promueven una cultura de integridad", "comportamientos": ["Comunica posiciones éticas difíciles ante la alta dirección o los órganos de gobierno correspondientes, sin ambigüedad ni postergación.", "Diseña políticas, controles y marcos internos que previenen conductas no éticas de forma sistémica.", "Actúa consistentemente con los mismos estándares éticos independientemente de quién observa o del costo personal.", "Gestiona conflictos de interés con total transparencia y documenta su proceso de decisión."]}, "3": {"anclaConductual": "Defiende posiciones éticas con impacto visible en su área y equipo", "comportamientos": ["Señala inconsistencias éticas en su entorno aunque implique tensión con superiores o pares.", "Declina instrucciones que considera éticamente comprometidas y las escala formalmente por los canales correctos.", "Construye un entorno donde su equipo se siente seguro de reportar comportamientos cuestionables.", "Mantiene confidencialidad y manejo responsable de información sensible."]}, "2": {"anclaConductual": "Actúa con integridad en sus decisiones cotidianas y gestiona adecuadamente los conflictos de interés", "comportamientos": ["Cumple sus compromisos con consistencia entre lo que dice y lo que hace.", "Evita usar información privilegiada o recursos institucionales para beneficio personal.", "Alerta a su superior cuando percibe una situación de conflicto de interés, propia o ajena.", "Maneja la información sensible con discreción y conforme a los protocolos de privacidad vigentes."]}, "1": {"anclaConductual": "Sigue los estándares éticos establecidos y escala situaciones ambiguas", "comportamientos": ["Cumple los códigos de conducta y políticas éticas de la organización sin necesidad de recordatorio frecuente.", "Pregunta a su superior cuando enfrenta una situación ambigua éticamente, en lugar de resolver por su cuenta.", "No comparte información confidencial fuera de los canales autorizados."]}}}, {"id": "adaptabilidad", "categoria": "B", "nombre": "Adaptabilidad", "definicion": "Capacidad para ajustarse a cambios y nuevas circunstancias, manteniendo la eficacia y la productividad, con flexibilidad, mente abierta, resiliencia y disposición para adaptarse a entornos cambiantes.", "notaDiferenciacion": "Diferenciación respecto a Agilidad: Adaptabilidad describe la capacidad de mantener efectividad ante el cambio (orientada al ser y al mindset). Agilidad describe la capacidad de actuar con rapidez y aprovechar datos y tecnología para acelerar resultados (orientada al hacer y a la ejecución). Una persona puede ser adaptable sin ser ágil en sentido operativo.", "niveles": {"4": {"anclaConductual": "Lidera la adaptación organizacional impulsando entornos flexibles y resilientes", "comportamientos": ["No solo se adapta, sino que lidera el cambio dentro de la organización, impulsando iniciativas con visión clara de cómo los cambios mejoran los resultados a largo plazo.", "Maneja varios cambios o transiciones simultáneamente sin perder el enfoque ni la productividad.", "Se adapta a cambios constantes también en términos de su propio desarrollo personal y profesional."]}, "3": {"anclaConductual": "Anticipa los cambios y se prepara antes de que ocurran, ajustando estrategia y equipo", "comportamientos": ["Anticipa cambios en el entorno y ajusta su enfoque o estrategia antes de que el cambio se imponga.", "Identifica lo prioritario en situaciones cambiantes y redistribuye su carga de trabajo con eficiencia.", "Asume nuevos roles o tareas con confianza, mostrando apertura genuina ante la expansión de sus responsabilidades."]}, "2": {"anclaConductual": "Se ajusta a los cambios buscando soluciones prácticas con moderada facilidad", "comportamientos": ["Se ajusta a cambios sin resistencia excesiva, buscando comprender la nueva situación antes de actuar.", "Toma decisiones que favorecen la continuidad del trabajo, aunque en ocasiones puede necesitar apoyo.", "Muestra disposición a aprender nuevas habilidades o procesos, aunque requiere tiempo para asimilarlos completamente."]}, "1": {"anclaConductual": "Se adapta a los cambios cuando es estrictamente necesario, con orientación del superior", "comportamientos": ["Enfrenta cambios en el entorno o procesos, pero requiere orientación para ajustar sus métodos.", "Se siente incómodo al salir de su zona de confort, aunque logra ajustarse con el tiempo y apoyo.", "Responde a situaciones cambiantes solo cuando es evidente que son necesarias, sin anticiparse."]}}}, {"id": "agilidad", "categoria": "B", "nombre": "Agilidad", "definicion": "Capacidad para actuar con rapidez, flexibilidad y eficacia ante los cambios, priorizando la ejecución oportuna, la toma de decisiones informadas y el uso eficiente de herramientas digitales. Implica resolver con velocidad sin sacrificar calidad y aprovechar datos y tecnología para lograr resultados tangibles en menor tiempo.", "notaDiferenciacion": "Diferenciación respecto a Adaptabilidad: Agilidad se centra en la velocidad de respuesta y la capacidad de ejecutar rápido usando tecnología y datos. Adaptabilidad se centra en la mentalidad de apertura y la resiliencia ante el cambio.", "niveles": {"4": {"anclaConductual": "Lidera transformaciones ágiles a nivel organizacional combinando ejecución y visión estratégica", "comportamientos": ["Lidera transformaciones ágiles en entornos complejos y cambiantes con velocidad e impacto medible.", "Diseña soluciones basadas en análisis avanzado de datos e inteligencia digital.", "Desarrolla entornos de trabajo que promueven velocidad, foco y adaptabilidad en sus equipos.", "Impulsa una mentalidad ágil a nivel organizacional, conectando la ejecución rápida con la visión de largo plazo."]}, "3": {"anclaConductual": "Demuestra agilidad como enfoque estratégico: usa datos para anticipar y acelerar resultados", "comportamientos": ["Promueve una cultura de ejecución ágil, enfocándose en resultados tangibles y medibles.", "Analiza información y datos para tomar decisiones acertadas en el corto plazo sin sacrificar calidad.", "Optimiza procesos utilizando tecnología y soluciones digitales disponibles.", "Se anticipa a cambios, ajustando planes y recursos con flexibilidad y sin demoras."]}, "2": {"anclaConductual": "Aplica la agilidad en su trabajo cotidiano usando recursos digitales para mantener eficiencia bajo presión", "comportamientos": ["Responde de manera rápida y eficiente ante requerimientos imprevistos, priorizando sin perder calidad.", "Integra herramientas digitales en su flujo de trabajo para optimizar tiempos de respuesta.", "Toma decisiones simples con base en datos disponibles, sin esperar información perfecta.", "Mantiene la calidad en contextos de urgencia o cambio constante."]}, "1": {"anclaConductual": "Demuestra apertura al cambio operativo y usa herramientas básicas para mantener el ritmo de trabajo", "comportamientos": ["Se adapta a cambios operativos o de prioridades con actitud receptiva.", "Utiliza herramientas digitales básicas para completar sus tareas en tiempo.", "Ejecuta sus funciones de manera oportuna siguiendo instrucciones claras.", "Solicita apoyo cuando surgen barreras que afectan la velocidad del trabajo."]}}}, {"id": "atencion-al-detalle", "categoria": "B", "nombre": "Atención al detalle", "definicion": "Habilidad para ejecutar tareas con precisión y cuidado, garantizando la calidad en el trabajo y considerando todos los aspectos relevantes antes de entregar un resultado.", "notaDiferenciacion": "", "niveles": {"4": {"anclaConductual": "Diseña e implementa sistemas y estándares de control de calidad", "comportamientos": ["Diseña e implementa mecanismos y estándares para asegurar la calidad en procesos clave de la organización.", "Evalúa continuamente la efectividad de los controles existentes y realiza mejoras.", "Forma y asesora a otros en prácticas de aseguramiento de calidad y precisión.", "Establece una cultura organizacional basada en la excelencia, el detalle y la mejora continua."]}, "3": {"anclaConductual": "Revisa y asegura la calidad del trabajo de su equipo", "comportamientos": ["Verifica y valida entregables de su equipo para asegurar cumplimiento de estándares de calidad.", "Identifica errores o inconsistencias en el trabajo de otros y brinda retroalimentación constructiva.", "Establece prácticas de control de calidad dentro de su equipo o área.", "Promueve el cuidado por los detalles como parte de la cultura de trabajo."]}, "2": {"anclaConductual": "Revisa su propio trabajo para asegurar la calidad antes de entregarlo", "comportamientos": ["Verifica la exactitud y consistencia de su trabajo antes de entregarlo.", "Detecta y corrige errores menores sin necesidad de supervisión.", "Aplica procedimientos de control de calidad de forma regular.", "Demuestra compromiso con la entrega de resultados correctos y completos."]}, "1": {"anclaConductual": "Realiza tareas con precisión básica bajo supervisión", "comportamientos": ["Cumple con tareas simples, pero puede omitir detalles relevantes si no se le supervisa.", "Comete errores menores por falta de revisión o verificación del trabajo.", "Sigue instrucciones, aunque necesita apoyo para asegurar calidad y consistencia.", "Presta atención a los detalles solo cuando se le solicita expresamente."]}}}, {"id": "desarrollo-creativo", "categoria": "B", "nombre": "Desarrollo creativo", "definicion": "Capacidad para generar y aplicar ideas innovadoras que mejoren productos, procesos o servicios, integrando tecnología, tendencias del mercado y nuevas formas de trabajo. Implica curiosidad y disposición a experimentar dentro de marcos éticos y normativos, contribuyendo a la transformación digital y la mejora continua de la organización.", "notaDiferenciacion": "Diferenciación respecto a Mejora continua: Desarrollo creativo produce ideas nuevas, disruptivas o que rompen con el status quo (innovación). Mejora continua optimiza lo que ya existe de forma incremental (eficiencia). Una persona puede mejorar continuamente sin generar ideas creativas, y una persona creativa puede proponer ideas sin implementarlas de forma sistemática.", "niveles": {"4": {"anclaConductual": "Lidera la agenda de innovación, conectando oportunidades del entorno con soluciones originales de alto impacto", "comportamientos": ["Lidera iniciativas de innovación alineadas con la estrategia de la organización y con impacto medible.", "Conecta tendencias y disrupciones del entorno con soluciones adaptadas al contexto local de la organización.", "Promueve una cultura de innovación segura, sostenible y dentro de los marcos normativos vigentes."]}, "3": {"anclaConductual": "Genera y propone soluciones creativas originales — no optimizaciones — con impacto en procesos, productos o servicios", "comportamientos": ["Diseña propuestas innovadoras que no existían antes, con impacto demostrable en procesos, productos o servicios.", "Analiza tendencias del entorno y las traduce en oportunidades concretas para la organización.", "Facilita la cocreación de soluciones nuevas entre diferentes equipos o áreas."]}, "2": {"anclaConductual": "Experimenta con nuevas ideas y propone soluciones que van más allá de ajustar lo existente", "comportamientos": ["Propone ideas o enfoques que no habían sido considerados previamente en su área de trabajo.", "Desarrolla soluciones prácticas aplicando herramientas digitales de formas no convencionales.", "Explora nuevas formas de trabajo dentro de las normas establecidas."]}, "1": {"anclaConductual": "Propone mejoras incrementales a lo que ya existe", "comportamientos": ["Propone pequeñas mejoras a procesos o tareas ya existentes.", "Participa en espacios de intercambio de ideas y aprendizaje con disposición.", "Usa recursos básicos de forma creativa para facilitar su trabajo inmediato."]}}}, {"id": "empatia", "categoria": "B", "nombre": "Empatía", "definicion": "Habilidad para comprender, percibir y responder a los sentimientos, pensamientos y necesidades de clientes y colaboradores, mejorando la calidad del servicio, las relaciones laborales y la toma de decisiones en contextos de alta carga emocional.", "notaDiferenciacion": "Diferenciación respecto a Colaboración: Empatía es una habilidad interpersonal centrada en la comprensión emocional del individuo — cliente o colaborador — y en la respuesta apropiada a su estado emocional. Colaboración es una habilidad de dinámica grupal centrada en la construcción conjunta de resultados.", "niveles": {"4": {"anclaConductual": "Anticipa y gestiona las necesidades emocionales del entorno, formando a otros en habilidades empáticas", "comportamientos": ["Detecta tensiones emocionales antes de que escalen y actúa preventivamente para abordarlas.", "Escucha y valida todas las perspectivas en conflicto sin emitir juicios prematuros.", "Media con empatía y equilibrio, promoviendo soluciones que consideran tanto lo emocional como lo operativo.", "Forma a otros en el desarrollo de habilidades empáticas para la gestión de relaciones complejas."]}, "3": {"anclaConductual": "Responde de manera efectiva a las necesidades emocionales de clientes y colaboradores en situaciones complejas", "comportamientos": ["Identifica emociones subyacentes en el discurso o comportamiento del cliente o colaborador.", "Ajusta su tono, lenguaje y acciones para generar confianza, contención y cercanía.", "Ayuda a otros a sentirse escuchados y comprendidos en momentos sensibles.", "Resuelve situaciones teniendo en cuenta tanto los hechos como el estado emocional de la otra persona."]}, "2": {"anclaConductual": "Reconoce señales emocionales y ajusta su comunicación para generar confianza", "comportamientos": ["Escucha activamente y demuestra interés genuino por lo que el cliente o colaborador expresa.", "Reconoce señales emocionales básicas y adapta su comunicación para generar confianza.", "Valida verbalmente las emociones o preocupaciones de la otra persona.", "Responde de manera oportuna, procurando alivio o soluciones acordes a las necesidades percibidas."]}, "1": {"anclaConductual": "Escucha con atención y muestra disposición a comprender la perspectiva del otro", "comportamientos": ["Presta atención cuando otros expresan ideas o emociones, sin interrumpir.", "Demuestra interés por comprender lo que el otro dice, aunque no siempre profundiza en la dimensión emocional.", "Responde de forma cordial, aunque de manera limitada, a las preocupaciones o estados emocionales del otro."]}}}, {"id": "gestion-de-conflictos", "categoria": "B", "nombre": "Gestión de conflictos", "definicion": "Capacidad para manejar y resolver conflictos de manera efectiva, asegurando un ambiente de trabajo positivo.", "notaDiferenciacion": "", "niveles": {"4": {"anclaConductual": "Desarrolla políticas y marcos institucionales de gestión de conflictos", "comportamientos": ["Diseña marcos, protocolos o políticas institucionales para la prevención y resolución de conflictos.", "Capacita y asesora a líderes y equipos en técnicas efectivas de mediación y resolución.", "Evalúa el impacto de los conflictos en la cultura organizacional y propone acciones correctivas sostenidas.", "Promueve una cultura de diálogo y convivencia positiva en todos los niveles de la organización."]}, "3": {"anclaConductual": "Resuelve conflictos complejos que involucran múltiples intereses o alta carga emocional", "comportamientos": ["Interviene de forma oportuna y objetiva en conflictos que involucran múltiples intereses o emociones.", "Escucha activamente a todas las partes, promoviendo el diálogo y el entendimiento mutuo.", "Diseña estrategias de resolución sostenibles, considerando causas profundas del conflicto.", "Mantiene la neutralidad y el enfoque en los objetivos comunes, aun en contextos de alta tensión."]}, "2": {"anclaConductual": "Aborda desacuerdos con actitud constructiva, buscando entendimiento y reducción de tensiones", "comportamientos": ["Identifica patrones o causas que originan tensiones dentro del equipo o con clientes.", "Aborda desacuerdos con actitud constructiva, buscando entendimiento mutuo.", "Dialoga con las partes involucradas para aclarar malentendidos y reducir tensiones.", "Propone soluciones prácticas a conflictos moderados, priorizando el respeto y la colaboración."]}, "1": {"anclaConductual": "Reconoce conflictos básicos y los escala al canal apropiado", "comportamientos": ["Reconoce desacuerdos o tensiones básicas entre compañeros o con clientes.", "Informa a su superior o solicita ayuda cuando percibe una situación conflictiva que supera su capacidad de resolución.", "Evita escalar situaciones problemáticas innecesariamente, pero no siempre sabe cómo intervenir.", "Muestra disposición a colaborar en la resolución, aunque sin tomar un rol activo en la mediación."]}}}, {"id": "gestion-del-riesgo", "categoria": "B", "nombre": "Gestión del riesgo", "definicion": "Capacidad para identificar, evaluar y mitigar riesgos operativos, financieros, de seguridad y de otro tipo, asegurando la estabilidad y continuidad de las operaciones de la organización.", "notaDiferenciacion": "", "niveles": {"4": {"anclaConductual": "Anticipa riesgos emergentes y desarrolla estrategias proactivas de mitigación a nivel organizacional", "comportamientos": ["Identifica con anticipación riesgos emergentes o no evidentes que podrían afectar la operación.", "Diseña e implementa estrategias preventivas de alto impacto para minimizar amenazas futuras.", "Asesora a otros equipos o áreas en la gestión integral de riesgos, siendo un referente interno.", "Contribuye en la definición de políticas, modelos o marcos de riesgo a nivel organizacional."]}, "3": {"anclaConductual": "Gestiona riesgos de manera efectiva tomando decisiones fundamentadas en análisis multiescenario", "comportamientos": ["Analiza riesgos complejos considerando múltiples variables y escenarios posibles.", "Implementa medidas preventivas y correctivas efectivas para minimizar impactos.", "Documenta y comunica sus decisiones de gestión de riesgo de forma clara y basada en datos.", "Promueve prácticas de gestión de riesgo dentro de su equipo o área."]}, "2": {"anclaConductual": "Identifica los riesgos de su área y toma decisiones equilibradas basadas en la evaluación del contexto", "comportamientos": ["Reconoce riesgos potenciales en su área y evalúa su impacto antes de actuar.", "Aplica procedimientos establecidos para mitigar riesgos de forma oportuna y adecuada.", "Toma decisiones considerando tanto la continuidad operativa como la minimización del riesgo."]}, "1": {"anclaConductual": "Reconoce riesgos evidentes y sigue procedimientos de control establecidos", "comportamientos": ["Identifica riesgos evidentes, pero no actúa consistentemente para prevenirlos o mitigarlos.", "Requiere supervisión para aplicar controles básicos o seguir procedimientos de seguridad establecidos.", "Tiende a reaccionar ante situaciones de riesgo en lugar de anticiparse a ellas."]}}}, {"id": "liderazgo", "categoria": "B", "nombre": "Liderazgo", "definicion": "Capacidad para guiar, motivar e influir en personas o equipos hacia el logro de objetivos compartidos, integrando inteligencia emocional para generar confianza, conexión y un clima positivo. Implica autoconocimiento, autorregulación, empatía, escucha activa y la habilidad para inspirar, desarrollar y movilizar a otros en contextos dinámicos y retadores.", "notaDiferenciacion": "El Nivel 4 diferencia explícitamente el liderazgo ejecutivo (liderazgo de líderes, anticipación de riesgos, visión estratégica integrada) del liderazgo de equipos directos, propio del Nivel 3.", "niveles": {"4": {"anclaConductual": "Lidera líderes hacia el logro de objetivos estratégicos, desarrollando la capacidad directiva de la organización", "comportamientos": ["Inspira y moviliza a su equipo directivo para alcanzar metas organizacionales de alto impacto.", "Traduce la visión estratégica en decisiones concretas, anticipando riesgos y ajustando el rumbo con agilidad.", "Desarrolla líderes dentro de su equipo, promoviendo autonomía, crecimiento y responsabilidad ampliada.", "Lidera con presencia, autoconsciencia y empatía en entornos de alta complejidad, crisis o transformación.", "Construye una cultura de confianza donde el equipo directivo puede disentir, innovar y asumir riesgos calculados."]}, "3": {"anclaConductual": "Desarrolla planes de acción para su equipo alineados con la estrategia organizacional", "comportamientos": ["Define objetivos estratégicos y operativos para su equipo, alineados con los planes organizacionales.", "Diseña, implementa y supervisa planes de trabajo claros, con cronogramas, indicadores y responsables.", "Motiva a su equipo, fortaleciendo la colaboración y la confianza mutua.", "Inspira mediante una visión clara y liderazgo emocionalmente inteligente."]}, "2": {"anclaConductual": "Gestiona el desempeño de su equipo con claridad y acompañamiento", "comportamientos": ["Establece metas claras y distribuye responsabilidades de forma equitativa entre los miembros del equipo.", "Realiza seguimiento al cumplimiento de tareas y entrega retroalimentación básica sobre desempeño.", "Detecta dificultades individuales o grupales e implementa acciones correctivas simples.", "Motiva y orienta a otros con empatía, generando vínculos de confianza."]}, "1": {"anclaConductual": "Coordina tareas básicas del equipo y apoya a sus compañeros", "comportamientos": ["Da seguimiento a actividades operativas asignadas a compañeros o subgrupos.", "Comunica instrucciones simples y se asegura de que las tareas se ejecuten en tiempo.", "Solicita apoyo a superiores cuando surgen dificultades para organizar al equipo.", "Muestra disposición a apoyar a otros, aunque aún no ejerce influencia clara sobre el grupo."]}}}, {"id": "mejora-continua", "categoria": "B", "nombre": "Mejora continua", "definicion": "Capacidad para identificar oportunidades de mejora en procesos, sistemas y prácticas existentes, implementar optimizaciones de forma sistemática y fomentar una cultura de aprendizaje e innovación incremental que aumente la eficiencia y la competitividad.", "notaDiferenciacion": "Diferenciación respecto a Desarrollo creativo: Mejora continua optimiza y perfecciona lo que ya existe (eficiencia incremental). Desarrollo creativo genera ideas que no existían antes (innovación disruptiva). Una persona de Mejora continua pregunta '¿cómo hacemos esto mejor?'; una de Desarrollo creativo pregunta '¿por qué seguimos haciendo esto?'.", "niveles": {"4": {"anclaConductual": "Lidera una cultura de mejora constante con impacto organizacional y referencia interna en eficiencia", "comportamientos": ["Lidera iniciativas estratégicas de mejora que impactan la eficiencia a nivel organizacional.", "Promueve activamente una mentalidad de aprendizaje continuo y cuestionamiento de procesos establecidos.", "Identifica tendencias, metodologías o tecnologías que fortalecen la competitividad institucional.", "Es referente interno en temas de eficiencia operativa y mejora de procesos."]}, "3": {"anclaConductual": "Impulsa mejoras sistemáticas en procesos existentes dentro de su equipo o área", "comportamientos": ["Identifica de forma sistemática oportunidades de mejora en procesos de su equipo o área — sobre lo que ya existe, no ideas completamente nuevas.", "Implementa soluciones que generan eficiencia y valor agregado dentro de los marcos establecidos.", "Motiva a sus compañeros a cuestionar lo establecido y buscar formas de hacerlo mejor.", "Comparte buenas prácticas e impulsa su adopción dentro del equipo."]}, "2": {"anclaConductual": "Aplica mejoras regulares a sus tareas habituales optimizando tiempo o recursos", "comportamientos": ["Identifica oportunidades de mejora en sus tareas habituales y aplica cambios concretos para optimizar tiempo o recursos.", "Muestra disposición a ajustar procesos cuando detecta ineficiencias.", "Comparte sugerencias de mejora con su equipo o superiores de forma constructiva."]}, "1": {"anclaConductual": "Realiza ajustes mínimos reactivos con poca iniciativa proactiva", "comportamientos": ["Realiza ajustes o mejoras solo cuando se le solicita o ante errores evidentes.", "Muestra resistencia o poca iniciativa para cuestionar procesos existentes o proponer alternativas.", "Se enfoca en cumplir con tareas sin buscar formas de hacerlas más eficientes."]}}}, {"id": "negociacion", "categoria": "B", "nombre": "Negociación", "definicion": "Habilidad para alcanzar acuerdos mediante el diálogo, la persuasión y el intercambio estratégico de propuestas, preservando las relaciones clave y generando valor para la organización y sus contrapartes.", "notaDiferenciacion": "", "niveles": {"4": {"anclaConductual": "Domina negociaciones estratégicas complejas con múltiples partes e impacto organizacional alto", "comportamientos": ["Lidera negociaciones estratégicas con múltiples partes interesadas y alto impacto organizacional.", "Diseña estrategias de negociación basadas en análisis de riesgos, intereses y escenarios futuros.", "Cierra acuerdos complejos maximizando beneficios para la organización y manteniendo relaciones clave.", "Actúa como referente o asesor en procesos de negociación críticos."]}, "3": {"anclaConductual": "Negocia términos y condiciones con clientes y proveedores con enfoque estratégico", "comportamientos": ["Prepara negociaciones analizando necesidades, intereses y márgenes de flexibilidad.", "Llega a acuerdos beneficiosos para ambas partes, cuidando la relación a largo plazo.", "Utiliza tácticas de persuasión y propone concesiones razonables para cerrar acuerdos.", "Maneja objeciones y conflictos durante la negociación con enfoque estratégico y profesional."]}, "2": {"anclaConductual": "Negocia términos básicos con argumentos claros y disposición a encontrar soluciones", "comportamientos": ["Presenta argumentos claros para defender su posición en negociaciones formales o informales.", "Logra acuerdos satisfactorios en temas operativos o de baja complejidad.", "Propone opciones de solución ante diferencias simples, mostrando flexibilidad.", "Mantiene el respeto y la colaboración durante todo el proceso de negociación."]}, "1": {"anclaConductual": "Participa en negociaciones simples escuchando y aceptando orientación", "comportamientos": ["Interviene en conversaciones orientadas a resolver desacuerdos de baja complejidad.", "Escucha las posiciones de las otras partes sin generar confrontaciones innecesarias.", "Acepta acuerdos definidos por otros, sin aportar aún propuestas propias.", "Muestra disposición para colaborar y llegar a soluciones consensuadas, aunque requiere guía."]}}}, {"id": "orientacion-al-cliente", "categoria": "B", "nombre": "Orientación al cliente", "definicion": "Capacidad para crear fidelidad y alta vinculación con clientes por medio de productos y servicios basados en sus necesidades y características específicas, con alto enfoque en la satisfacción del cliente.", "notaDiferenciacion": "", "niveles": {"4": {"anclaConductual": "Diseña experiencias excepcionales y personalizadas que generan fidelidad y vinculación de largo plazo", "comportamientos": ["Comprende profundamente las necesidades, deseos y expectativas de los clientes y utiliza ese conocimiento para diseñar experiencias únicas y altamente personalizadas.", "Anticipa las necesidades futuras de los clientes ofreciendo soluciones innovadoras antes de que sean solicitadas.", "Actúa como embajador de la organización, manteniendo relaciones duraderas con clientes y convirtiéndolos en promotores leales.", "Evalúa continuamente el feedback de los clientes y ajusta el enfoque para mantener relaciones estratégicas a largo plazo."]}, "3": {"anclaConductual": "Anticipa las necesidades del cliente y ofrece soluciones proactivas y personalizadas", "comportamientos": ["Escucha activamente a los clientes y adapta su enfoque para ofrecer soluciones específicas que van más allá de las expectativas.", "Se involucra activamente en la construcción de relaciones de largo plazo con los clientes.", "Hace un esfuerzo por conocer las preferencias y características específicas de cada cliente.", "Maneja situaciones complejas o difíciles de manera eficaz, transformando posibles experiencias negativas en oportunidades."]}, "2": {"anclaConductual": "Identifica las necesidades del cliente y proporciona soluciones adecuadas dentro de los límites disponibles", "comportamientos": ["Realiza preguntas para comprender mejor las necesidades del cliente y ofrece productos o servicios alineados.", "Proporciona soluciones personalizadas dentro de los límites establecidos por los productos o servicios disponibles.", "Establece una relación cordial con los clientes, buscando garantizar que sus problemas se resuelvan adecuadamente.", "Detecta oportunidades para mejorar la satisfacción del cliente, aunque su enfoque sigue siendo principalmente reactivo."]}, "1": {"anclaConductual": "Responde a las solicitudes de los clientes de manera reactiva con conocimiento limitado de sus necesidades", "comportamientos": ["Responde a las solicitudes de los clientes de manera reactiva, sin anticipar necesidades.", "Ofrece soluciones estándar sin personalización, con un enfoque en la resolución básica de problemas.", "Se limita a cumplir con las solicitudes de los clientes sin hacer un esfuerzo adicional.", "No establece una relación duradera con los clientes más allá de la transacción puntual."]}}}, {"id": "pensamiento-analitico", "categoria": "B", "nombre": "Pensamiento analítico", "definicion": "Capacidad para gestionar problemas complejos evaluando información de manera lógica, analizando datos para la toma de decisiones y comunicando hallazgos con claridad.", "notaDiferenciacion": "Diferenciación respecto a Pensamiento estratégico: Pensamiento analítico resuelve problemas actuales descomponiendo información y datos para llegar a conclusiones válidas (¿qué está pasando y por qué?). Pensamiento estratégico anticipa el futuro y define la dirección de largo plazo (¿hacia dónde vamos y cómo?).", "niveles": {"4": {"anclaConductual": "Desarrolla modelos analíticos innovadores para resolver problemas estratégicos complejos a nivel organizacional", "comportamientos": ["Desarrolla modelos o enfoques analíticos innovadores para resolver problemas complejos a nivel organizacional.", "Interpreta grandes volúmenes de datos y transforma la información en estrategias accionables.", "Es consultado como referente en temas de análisis, aportando valor en decisiones de alto impacto.", "Anticipa escenarios futuros y propone soluciones estratégicas basadas en análisis predictivos."]}, "3": {"anclaConductual": "Realiza análisis complejos de situaciones actuales, integrando múltiples fuentes y comunicando implicaciones con claridad", "comportamientos": ["Analiza problemas complejos del contexto actual integrando múltiples fuentes de información y variables.", "Utiliza herramientas o metodologías avanzadas para evaluar datos y generar soluciones efectivas.", "Interpreta resultados con precisión y comunica implicaciones de manera clara a audiencias no técnicas.", "Apoya la toma de decisiones operativas y tácticas mediante análisis profundos y estructurados."]}, "2": {"anclaConductual": "Analiza datos disponibles para identificar patrones y sustentar decisiones en su área de responsabilidad", "comportamientos": ["Recolecta y analiza datos relevantes para comprender situaciones o resolver problemas en su ámbito.", "Identifica patrones, causas comunes o tendencias que apoyan su toma de decisiones.", "Aplica métodos lógicos para estructurar información y llegar a conclusiones válidas.", "Sustenta sus propuestas o decisiones con evidencia verificable, no solo intuición."]}, "1": {"anclaConductual": "Utiliza datos básicos disponibles con falta de profundidad o precisión en el análisis", "comportamientos": ["Utiliza datos o información básica para resolver problemas, pero sin validar su calidad o relevancia.", "Sus análisis suelen ser superficiales o poco estructurados.", "Requiere orientación para identificar causas raíz o relaciones entre variables.", "Puede llegar a conclusiones apresuradas sin considerar todas las evidencias disponibles."]}}}, {"id": "pensamiento-estrategico", "categoria": "B", "nombre": "Pensamiento estratégico", "definicion": "Capacidad para anticiparse a cambios y tomar decisiones alineadas con la estrategia organizacional, analizando el entorno, las tendencias del mercado y los datos. Implica visión a largo plazo, agilidad y el uso de tecnologías y análisis para generar ventajas competitivas.", "notaDiferenciacion": "Diferenciación respecto a Pensamiento analítico: Pensamiento estratégico define hacia dónde va la organización y cómo posicionarse en el futuro (¿hacia dónde vamos?). Pensamiento analítico descompone lo que está ocurriendo hoy para explicarlo y resolverlo (¿qué está pasando y por qué?).", "niveles": {"4": {"anclaConductual": "Define y comunica la visión estratégica de largo plazo, liderando la dirección de la organización", "comportamientos": ["Define y comunica una visión estratégica que orienta las decisiones y prioridades organizacionales.", "Anticipa tendencias y disrupciones, ajustando la estrategia para mantener la competitividad a largo plazo.", "Lidera la formulación de planes estratégicos integrales y sostenibles.", "Influye en altos niveles de toma de decisiones, alineando la organización con su visión de futuro."]}, "3": {"anclaConductual": "Desarrolla planes estratégicos a mediano plazo evaluando el entorno y proponiendo acciones para aprovechar oportunidades", "comportamientos": ["Diseña estrategias alineadas con los objetivos organizacionales, considerando el análisis del entorno externo.", "Propone acciones para aprovechar oportunidades o mitigar amenazas de forma anticipad /* ---------------- storage (Google Sheets vía Apps Script) ---------------- */
async function apiGet(params){
  const url = new URL(CONFIG.API_URL);
  Object.keys(params||{}).forEach(k=>url.searchParams.set(k, params[k]));
  const res = await fetch(url.toString());
  return res.json();
}
async function apiPost(payload){
  // Content-Type text/plain evita el preflight CORS que Apps Script no maneja bien.
  const res = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  return res.json();
}
async function loadDB(){
  const data = await apiGet({ action:'getAll', key: CONFIG.API_KEY });
  if(data && data.error){ throw new Error(data.error); }
  DB = data;
}
async function saveDB(){
  const res = await apiPost({ action:'saveAll', key: CONFIG.API_KEY, data: DB });
  if(res && res.error){ console.error('saveDB error', res.error); toast('Error guardando: '+res.error); }
}
function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

/* ---------------- helpers ---------------- */
function today(){ return new Date().toISOString().slice(0,10); }
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function findCliente(id){ return DB.clientes.find(c=>c.id===id); }
function findUsuario(id){ return DB.usuarios.find(u=>u.id===id); }
function findProyecto(id){ return DB.proyectos.find(p=>p.id===id); }
function usuariosCliente(clienteId){ return DB.usuarios.filter(u=>u.clienteId===clienteId); }
function proyectosCliente(clienteId){ return DB.proyectos.filter(p=>p.clienteId===clienteId); }

function getCompetenciaFull(id, clienteId){
  const g = ELEVATE_DICT.find(c=>c.id===id);
  if(g) return g;
  return DB.competenciasCliente.find(c=>c.id===id && c.clienteId===clienteId);
}
function competenciasActivasProyecto(proyecto){
  const cliId = proyecto.clienteId;
  return DB.clienteCompetenciasActivas
    .filter(a=>a.clienteId===cliId && a.activa)
    .map(a=>{
      const full = getCompetenciaFull(a.competenciaId, cliId);
      if(!full) return null;
      return Object.assign({}, full, { nombreMostrado: a.nombrePersonalizado || full.nombre });
    })
    .filter(Boolean);
}
function scaleToNivel(score){
  score = Number(score);
  if(score<=1) return 1;
  if(score<=3) return 2;
  if(score===4) return 3;
  return 4;
}
function toast(msg){ STATE.toast = msg; render(); setTimeout(()=>{ STATE.toast=null; render(); }, 2600); }

/* ---------------- router / render ---------------- */
function go(route, extra){ STATE.route = route; Object.assign(STATE, extra||{}); STATE.modal=null; render(); window.scrollTo(0,0); }

function currentAdmin(){ return DB.admins.find(a=>a.id===STATE.adminId); }

const EVAL_CACHE = {};
function render(){
  const hash = window.location.hash;
  if(hash.startsWith('#/eval/')){
    const token = hash.replace('#/eval/','');
    if(!(token in EVAL_CACHE)){
      document.getElementById('app').innerHTML = `<div class="center-screen"><div class="auth-card"><p>Cargando tu evaluación...</p></div></div>`;
      apiGet({action:'evalByToken', token}).then(data=>{ EVAL_CACHE[token]=data; render(); });
      return;
    }
    document.getElementById('app').innerHTML = viewEvaluacionPublica(token, EVAL_CACHE[token]);
    return;
  }
  if(!STATE.adminId){
    document.getElementById('app').innerHTML = viewLogin();
    return;
  }
  let body = '';
  switch(STATE.route){
    case 'clientes': body = viewClientes(); break;
    case 'diccionario': body = viewDiccionario(); break;
    case 'usuarios': body = viewUsuarios(); break;
    case 'proyectos': body = viewProyectos(); break;
    case 'proyecto-detalle': body = viewProyectoDetalle(); break;
    case 'resultados': body = viewResultados(); break;
    case 'informe': body = viewInforme(); break;
    case 'administradores': body = viewAdministradores(); break;
    default: body = viewClientes();
  }
  document.getElementById('app').innerHTML = shell(body);
  if(STATE.toast) showToastDom(STATE.toast);
}
function showToastDom(msg){
  let t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2500);
}

async function doLogin(ev){
  ev.preventDefault();
  const email = document.getElementById('li-email').value.trim().toLowerCase();
  const pass = document.getElementById('li-pass').value;
  const err = document.getElementById('login-error');
  err.textContent = 'Verificando...';

  try{ res = await apiPost({action:'login', key:CONFIG.API_KEY, email, password:pass}); }

  catch(e){ err.textContent = 'Sesión iniciada, pero no se pudo cargar la base de datos: '+e.message; return false; }

function procesarCargaUsuarios(){
  const inp = document.getElementById('up-usuarios');
  const file = inp.files[0];
  if(!file){ alert('Selecciona un archivo primero.'); return; }
  parseTabularFile(file, async (rows)=>{
    let creados=0, duplicados=0, invalidos=0;
    rows.forEach(r=>{
      const nombre = (r.nombre||r.Nombre||'').toString().trim();
      const email = (r.email||r.Email||'').toString().trim().toLowerCase();
      const rol = (r.rol||r.Rol||'').toString().trim();
      if(!nombre||!email){ invalidos++; return; }
      if(DB.usuarios.some(u=>u.clienteId===STATE.clienteId && u.email.toLowerCase()===email)){ duplicados++; return; }
      DB.usuarios.push({id:uid('usr'), clienteId:STATE.clienteId, nombre, email, rol, activo:true});
      creados++;
    });
    await saveDB();
    document.getElementById('up-usuarios-result').innerHTML = `<strong>${creados}</strong> creados · <strong>${duplicados}</strong> ya existían · <strong>${invalidos}</strong> filas inválidas.`;
    render();
  });
}
function parseTabularFile(file, cb){
  const name = file.name.toLowerCase();
  if(name.endsWith('.csv')){
    Papa.parse(file, { header:true, skipEmptyLines:true, complete: res => cb(res.data) });
  } else {
    const reader = new FileReader();
    reader.onload = e => {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      cb(rows);
    };
    reader.readAsArrayBuffer(file);
  }
}

/* ================= RESULTADOS / OUTLIERS ================= */
function computeDispersion(proy){
  const comps = competenciasActivasProyecto(proy);
  const asigs = DB.asignaciones.filter(a=>a.proyectoId===proy.id && a.estado==='completado');
  return comps.map(c=>{
    const scores = [];
    asigs.forEach(a=>{
      const r = DB.respuestas.find(r=>r.asignacionId===a.id && r.competenciaId===c.id);
      if(r) scores.push(r.calificacion);
    });
    const below = scores.filter(s=>s<2.5).length;
    const above = scores.filter(s=>s>=2.5).length;
    const total = scores.length || 1;
    return { comp:c, n:scores.length, pctBelow: Math.round(100*below/total), pctAbove: Math.round(100*above/total) };
  });
}
function computeOutliers(proy){
  const comps = competenciasActivasProyecto(proy);
  const asigs = DB.asignaciones.filter(a=>a.proyectoId===proy.id && a.estado==='completado' && a.grupo!=='autoevaluacion');
  // cluster by evaluado+grupo
  const clusters = {};
  asigs.forEach(a=>{ const k=a.evaluadoId+'|'+a.grupo; (clusters[k]=clusters[k]||[]).push(a); });
  const results = [];
  Object.values(clusters).forEach(cluster=>{
    if(cluster.length<2) return;
    cluster.forEach(a=>{
      let diffs=[];
      comps.forEach(c=>{
        const mine = DB.respuestas.find(r=>r.asignacionId===a.id && r.competenciaId===c.id);
        if(!mine) return;
        const others = cluster.filter(x=>x.id!==a.id).map(x=>DB.respuestas.find(r=>r.asignacionId===x.id && r.competenciaId===c.id)).filter(Boolean).map(r=>r.calificacion);
        if(others.length===0) return;
        const avgOthers = others.reduce((s,v)=>s+v,0)/others.length;
        diffs.push(Math.abs(mine.calificacion - avgOthers));
      });
      if(diffs.length===0) return;
      const avgDiff = diffs.reduce((s,v)=>s+v,0)/diffs.length;
      const evaluador = findUsuario(a.evaluadorId);
      const evaluado = findUsuario(a.evaluadoId);
      results.push({ evaluador, evaluado, grupo:a.grupo, avgDiff, atipico: avgDiff >= 1.5 });
    });
  });
  return results.sort((a,b)=>b.avgDiff-a.avgDiff);
}
function tabResultados(proy){
  const disp = computeDispersion(proy);
  const outliers = computeOutliers(proy);
  return `

    <p class="small-muted" style="margin-bottom:14px;">% de calificaciones debajo vs. arriba del punto medio de la escala (2.5). Ayuda a distinguir consenso de polarización — visible solo para administradores.</p>

        <div style="display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--teal-50);">

function groupedResponses(proy, evaluadoId, competenciaId){
  const asigs = DB.asignaciones.filter(a=>a.proyectoId===proy.id && a.evaluadoId===evaluadoId && a.estado==='completado');
  const byGroup = {};
  asigs.forEach(a=>{
    const r = DB.respuestas.find(r=>r.asignacionId===a.id && r.competenciaId===competenciaId);
    if(!r) return;
    (byGroup[a.grupo]=byGroup[a.grupo]||[]).push(r.calificacion);
  });
  return byGroup;
}
function renderInformeCompleto(proy, evaluadoId){
  const evaluado = findUsuario(evaluadoId);
  const comps = competenciasActivasProyecto(proy);
  const pesos = DB.proyectoPesos.filter(p=>p.proyectoId===proy.id);
  const pesoMap = {}; pesos.forEach(p=>pesoMap[p.grupo]=p.peso);

  let rows = comps.map(c=>{
    const byGroup = groupedResponses(proy, evaluadoId, c.id);
    let sumW=0, sumWS=0;
    Object.keys(byGroup).forEach(g=>{
      if(g==='autoevaluacion') return;
      const vals = byGroup[g];
      if(vals.length < 2) return; // min 2 evaluadores por grupo
      const avg = vals.reduce((s,v)=>s+v,0)/vals.length;
      const w = pesoMap[g]||0;
      sumW += w; sumWS += w*avg;
    });
    const scoreFinal = sumW>0 ? sumWS/sumW : null;
    const nivel = scoreFinal!=null ? scaleToNivel(scoreFinal) : null;
    const nivelInfo = nivel!=null ? (c.niveles && c.niveles[nivel]) : null;
    const auto = byGroup['autoevaluacion'] ? byGroup['autoevaluacion'][0] : null;
    return { c, byGroup, scoreFinal, nivel, nivelInfo, auto };
  });

  const conDato = rows.filter(r=>r.scoreFinal!=null);
  const fortalezas = [...conDato].sort((a,b)=>b.scoreFinal-a.scoreFinal).slice(0,3);
  const areas = [...conDato].sort((a,b)=>a.scoreFinal-b.scoreFinal).slice(0,3);

  const reportId = 'report-'+evaluadoId;
  return `
  <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
    <button class="btn btn-terra" onclick="descargarPDF('${reportId}','${esc(evaluado.nombre).replace(/'/g,"")}')">↓ Descargar PDF</button>
  </div>
  <div class="card" id="${reportId}">
    <div class="report-header">
      <div><h2 style="margin-bottom:2px;">${esc(evaluado.nombre)}</h2><p class="small-muted">${esc(proy.nombre)} · Informe individual de evaluación 360°</p></div>
      <img src="${LOGO_SRC}"/>
    </div>

    <h4>Resumen</h4>
    <div class="grid-2" style="margin-bottom:18px;">
      <div>
        <div class="small-muted" style="font-weight:700;text-transform:uppercase;font-size:11px;margin-bottom:6px;">Fortalezas principales</div>
        ${fortalezas.length? fortalezas.map(r=>`<div style="margin-bottom:6px;">${semaforo(r.nivel)} ${esc(r.c.nombreMostrado)}</div>`).join('') : '<div class="small-muted">Datos insuficientes aún.</div>'}
      </div>
      <div>
        <div class="small-muted" style="font-weight:700;text-transform:uppercase;font-size:11px;margin-bottom:6px;">Áreas de atención</div>
        ${areas.length? areas.map(r=>`<div style="margin-bottom:6px;">${semaforo(r.nivel)} ${esc(r.c.nombreMostrado)}</div>`).join('') : '<div class="small-muted">Datos insuficientes aún.</div>'}
      </div>
    </div>

    <h4>Detalle por competencia</h4>
    ${rows.map(r=>`
      <div class="comp-block">
        <div class="comp-block-head">
          <span class="comp-name">${esc(r.c.nombreMostrado)}</span>
          ${r.nivel? semaforo(r.nivel) : '<span class="badge badge-neutral">Sin datos suficientes</span>'}
        </div>
        ${r.nivelInfo && r.nivelInfo.anclaConductual ? `<div class="ancla">"${esc(r.nivelInfo.anclaConductual)}"</div>` : ''}
        ${r.nivelInfo && r.nivelInfo.comportamientos && r.nivelInfo.comportamientos.length ? `<ul class="comport-list">${r.nivelInfo.comportamientos.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>` : ''}
        ${Object.keys(r.byGroup).filter(g=>g!=='autoevaluacion').map(g=>{
          const vals = r.byGroup[g];
          if(vals.length<2) return `<div class="group-row"><span>${GROUP_LABEL[g]}</span><span class="small-muted">Menos de 2 evaluadores — no se muestra</span></div>`;
          const avg = (vals.reduce((s,v)=>s+v,0)/vals.length).toFixed(1);
          return `<div class="group-row"><span>${GROUP_LABEL[g]} (n=${vals.length})</span><span><strong>${avg}</strong>/5</span></div>`;
        }).join('')}
        ${r.auto?`<div class="group-row"><span>Autoevaluación</span><span><strong>${r.auto}</strong>/5</span></div>`:''}
      </div>
    `).join('')}
  </div>`;
}
function semaforo(nivel){
  const labels = {1:'Nivel 1 · Básico',2:'Nivel 2 · Intermedio',3:'Nivel 3 · Avanzado',4:'Nivel 4 · Experto'};
  return `<span class="sema sema-${nivel}">${labels[nivel]}</span>`;
}
async function descargarPDF(elId, nombreArchivo){
  const el = document.getElementById(elId);
  toast('Generando PDF...');
  const canvas = await html2canvas(el, {scale:2, backgroundColor:'#ffffff'});
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p','pt','a4');
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = canvas.height * imgWidth / canvas.width;
  let heightLeft = imgHeight, position = 0;
  pdf.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
  heightLeft -= pageHeight;
  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
    heightLeft -= pageHeight;
  }
  pdf.save('Informe_360_'+nombreArchivo.replace(/\\s+/g,'_')+'.pdf');
}

    <h4>Cambiar mi contraseña</h4>

      <div class="field"><label>Nueva contraseña</label><input type="password" id="cp-new" required minlength="6"/></div>
      <button class="btn btn-primary btn-sm" type="submit">Actualizar contraseña</button>
    </form>
  </div>`;
}
function openModalAdmin(){
  STATE.modal = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h3>Nuevo administrador</h3>
      <form onsubmit="return crearAdmin(event)">
        <div class="field"><label>Nombre</label><input id="na2-nombre" required/></div>
        <div class="field"><label>Email</label><input id="na2-email" type="email" required/></div>
        <div class="field"><label>Contraseña inicial</label><input id="na2-pass" type="password" required minlength="6"/></div>
        <div class="field-hint">El administrador podrá cambiarla luego desde esta misma pantalla.</div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary">Crear</button>
        </div>
      </form>
    </div>
  </div>`; render();
}
async function crearAdmin(ev){
  ev.preventDefault();
  const nombre = document.getElementById('na2-nombre').value.trim();
  const email = document.getElementById('na2-email').value.trim().toLowerCase();
  const pass = document.getElementById('na2-pass').value;
  const res = await apiPost({action:'crearAdmin', key:CONFIG.API_KEY, nombre, email, password:pass});
  if(res && res.error){ alert(res.error); return false; }
  await loadDB(); closeModal(); go('administradores'); toast('Administrador creado');
  return false;
}
async function cambiarPassword(ev){
  ev.preventDefault();
  const pass = document.getElementById('cp-new').value;
  const admin = currentAdmin();
  const res = await apiPost({action:'cambiarPassword', key:CONFIG.API_KEY, email:admin.email, password:pass});
  if(res && res.error){ alert(res.error); return false; }
  toast('Contraseña actualizada');
  return false;
}

/* ---------------- boot ---------------- */
window.addEventListener('hashchange', render);
render(); // muestra login (o la evaluación pública) sin tocar la base de datos completa todavía
</script>
