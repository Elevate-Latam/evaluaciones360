  const hG = filas.length ? filas.length*14.5+4 : 0;
  const h = pad+hHead+hA+hB+hG+pad-2;
  pdfSpace(c,h+10);
  const y0=c.y;
  pdfColor(doc,'draw',PDFC.line); doc.setLineWidth(.8); doc.roundedRect(x,y0,w,h,7,7,'S');
  let y=y0+pad;
  pdfFont(doc,'bold',10.5); pdfColor(doc,'text',PDFC.teal900);
  nameLines.forEach((ln,i)=>doc.text(ln,x+pad,y+10+i*13));
  if(r.nivel) pdfPill(doc,x+w-pad,y,pillLabel,PDFC.sema[r.nivel],PDFC.semaText[r.nivel],true);
  else pdfPill(doc,x+w-pad,y,pillLabel,[236,231,226],PDFC.taupe,true);
  y+=hHead;
  if(anclaLines.length){ pdfFont(doc,'italic',9); pdfColor(doc,'text',PDFC.taupe); anclaLines.forEach((ln,i)=>doc.text(ln,x+pad,y+8.5+i*12)); y+=hA; }
  if(bullets.length){
    pdfFont(doc,'normal',8.8); pdfColor(doc,'text',PDFC.ink);
    bullets.forEach(b=>{ doc.text('•',x+pad+2,y+8.5); b.forEach((ln,i)=>doc.text(ln,x+pad+12,y+8.5+i*11.4)); y+=b.length*11.4+2.6; });
    y+=3;
  }
  filas.forEach(f=>{
    pdfColor(doc,'draw',PDFC.line); doc.setLineWidth(.4); doc.setLineDashPattern([2,2],0); doc.line(x+pad,y+1,x+w-pad,y+1); doc.setLineDashPattern([],0);
    pdfFont(doc,'normal',8.8); pdfColor(doc,'text',PDFC.taupe); doc.text(pdfClean(f.label),x+pad,y+10.5);
    pdfFont(doc,f.muted?'italic':'bold',f.muted?8.2:9); pdfColor(doc,'text',f.muted?PDFC.taupeL:PDFC.ink);
    doc.text(pdfClean(f.texto),x+w-pad,y+10.5,{align:'right'}); y+=14.5;
  });
  c.y=y0+h+9;
}
function pdfResumenCols(c,left,right){
  const doc=c.doc, colW=c.cw/2-10, xL=c.ml, xR=c.ml+c.cw/2+10, startY=c.y;
  function col(title,items,x){
    let y=startY;
    pdfFont(doc,'bold',8); pdfColor(doc,'text',PDFC.taupe); doc.text(title.toUpperCase(),x,y+8); y+=17;
    if(!items.length){ pdfFont(doc,'normal',9); pdfColor(doc,'text',PDFC.taupeL); doc.text('Datos insuficientes aún.',x,y+8); return y+16; }
    items.forEach(r=>{
      const label=NIVEL_LABEL[r.nivel], pw=pdfPillW(doc,label);
      pdfFont(doc,'bold',9.3);
      const lines=doc.splitTextToSize(pdfClean(r.c.nombreMostrado),colW-pw-10);
      pdfPill(doc,x,y,label,PDFC.sema[r.nivel],PDFC.semaText[r.nivel],false);
      pdfFont(doc,'bold',9.3); pdfColor(doc,'text',PDFC.ink);
      lines.forEach((ln,i)=>doc.text(ln,x+pw+8,y+10.3+i*11.5));
      y+=Math.max(15,lines.length*11.5)+7;
    });
    return y;
  }
  const y1=col('Fortalezas principales',left,xL), y2=col('Áreas de atención',right,xR);
  c.y=Math.max(y1,y2)+4;
}

    const h = Math.max.apply(null,cells.map(x=>x.lines.length))*lh+2*pad;
    if(c.y+h>c.H-c.mb){ doc.addPage(); c.y=c.mt; cabecera(); }

/* ================= RESULTADOS (solo Elevate): dispersión y evaluadores atípicos ================= */
function asigsValidas(proy){ return DB.asignaciones.filter(a=>a.proyectoId===proy.id && a.estado==='completado' && !T(a.archivado)); }
function computeDispersion(proy){
  const ids = new Set(asigsValidas(proy).map(a=>a.id));
  return competenciasActivasProyecto(proy).map(c=>{
    const sc = DB.respuestas.filter(r=>ids.has(r.asignacionId) && r.competenciaId===c.id).map(r=>r.calificacion);
    const bajo=sc.filter(s=>s<2.5).length, alto=sc.length-bajo, tot=sc.length||1;
    return {comp:c, n:sc.length, pctBelow:Math.round(100*bajo/tot), pctAbove:Math.round(100*alto/tot)};
  });
}
function computeOutliers(proy){
  const comps = competenciasActivasProyecto(proy), asigs = asigsValidas(proy).filter(a=>a.grupo!=='autoevaluacion'), cl={};
  asigs.forEach(a=>{ (cl[a.evaluadoId+'|'+a.grupo]=cl[a.evaluadoId+'|'+a.grupo]||[]).push(a); });
  const get=(a,cid)=>{ const r=DB.respuestas.find(x=>x.asignacionId===a.id && x.competenciaId===cid); return r?r.calificacion:null; };
  const out=[];
  Object.values(cl).forEach(g=>{ if(g.length<2) return; g.forEach(a=>{
    const d=[]; comps.forEach(c=>{ const mine=get(a,c.id); if(mine==null) return; const o=g.filter(x=>x.id!==a.id).map(x=>get(x,c.id)).filter(v=>v!=null); if(!o.length) return; d.push(Math.abs(mine-o.reduce((s,v)=>s+v,0)/o.length)); });
    if(!d.length) return; const avg=d.reduce((s,v)=>s+v,0)/d.length;
    out.push({evaluador:findUsuario(a.evaluadorId), evaluado:findUsuario(a.evaluadoId), grupo:a.grupo, avgDiff:avg, atipico:avg>=1.5});
  }); });
  return out.sort((a,b)=>b.avgDiff-a.avgDiff);
}
function tabResultados(proy){
  const disp=computeDispersion(proy), out=computeOutliers(proy);
  return `<div class="card"><h4>Dispersión por competencia</h4><p class="small-muted" style="margin-bottom:14px">% de calificaciones debajo vs. arriba del punto medio (2.5). Distingue consenso de polarización. Solo administradores de Elevate.</p>
    ${disp.every(d=>d.n===0)?emptyState('Aún no hay respuestas completas en este proyecto.'):disp.map(d=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px"><span>${esc(d.comp.nombreMostrado)}</span><span class="small-muted">n=${d.n}</span></div>
      <div style="display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--teal-50)"><div style="width:${d.pctBelow}%;background:var(--bad)"></div><div style="width:${d.pctAbove}%;background:var(--ok-soft)"></div></div>
      <div class="small-muted" style="margin-top:3px">${d.pctBelow}% debajo · ${d.pctAbove}% arriba</div></div>`).join('')}</div>
  <div class="card"><h4>Evaluadores atípicos</h4><p class="small-muted" style="margin-bottom:14px">Distancia promedio entre las calificaciones de cada evaluador y el promedio del resto de su mismo grupo. Alerta desde 1.5 puntos. Nunca se muestra al evaluado ni al cliente.</p>
    ${out.length===0?emptyState('Hace falta al menos 2 evaluadores completados en un mismo grupo.'):`<div class="table-wrap"><table><thead><tr><th>Evaluador</th><th>Evaluando a</th><th>Grupo</th><th>Distancia</th><th></th></tr></thead><tbody>${out.map(o=>`<tr><td>${esc(o.evaluador?o.evaluador.nombre:'?')}</td><td>${esc(o.evaluado?o.evaluado.nombre:'?')}</td><td>${GROUP_LABEL[o.grupo]}</td><td>${o.avgDiff.toFixed(2)}</td><td>${o.atipico?'<span class="outlier-flag">⚠ Atípico</span>':'<span class="small-muted">Dentro de rango</span>'}</td></tr>`).join('')}</tbody></table></div>`}</div>`;
}

function pdfDownload(doc, filename){

  const a = document.createElement('a'); a.href=url; a.download=filename; a.style.display='none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 15000);
  toast('PDF generado. Si no se guardó, usa «Vista previa PDF» y descárgalo desde ahí.');
}

  }
  const jefes = DB.asignaciones.filter(a=>a.proyectoId===proy.id && a.evaluadoId===evaluadoId && a.grupo==='jefe' && !T(a.archivado))
    .map(a=>findUsuario(a.evaluadorId)).filter(Boolean).sort((x,y)=>x.nombre.localeCompare(y.nombre,'es'));
  if(jefes.length) return { key:'u:'+jefes[0].id, nombre:jefes[0].nombre };
  return { key:'none', nombre:'Sin jefe identificado' };
}
function computeComparativo(proy){
  const comps = competenciasActivasProyecto(proy), pm = pesosMap(proy);
  const ids = [...new Set(DB.asignaciones.filter(a=>a.proyectoId===proy.id && !T(a.archivado)).map(a=>a.evaluadoId))].filter(id=>findUsuario(id));
  const map = {};
  ids.forEach(id=>{
    const j = jefeDeEvaluado(proy,id);
    const e = map[j.key] = map[j.key] || { jefe:j, miembros:[] };
    e.miembros.push({ id, nombre:findUsuario(id).nombre, celdas: comps.map(c=>{ const s=scoreCompetencia(proy,id,c.id,pm); return {score:s.score, auto:s.auto}; }) });
  });
  const equipos = Object.values(map).sort((a,b)=>((a.jefe.key==='none')-(b.jefe.key==='none')) || a.jefe.nombre.localeCompare(b.jefe.nombre,'es'));
  equipos.forEach(e=>{
    e.miembros.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
    const avg = f => comps.map((c,i)=>{ const v=e.miembros.map(m=>f(m.celdas[i])).filter(x=>x!=null); return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; });
    e.promScore = avg(x=>x.score);
    e.promBrecha = comps.map((c,i)=>{ const v=e.miembros.map(m=>brecha(m.celdas[i])).filter(x=>x!=null); return v.length? v.reduce((s,x)=>s+x,0)/v.length : null; });
  });
  return { comps, equipos };
}
function brecha(cel){ return (cel.score!=null && cel.auto!=null) ? (cel.auto - cel.score) : null; }
function brechaEstilo(d){
  if(d==null) return null;
  const a=Math.abs(d);
  if(a<0.5) return { bg:[238,243,243], fg:[37,35,31] };
  if(d>0) return a>=1 ? { bg:[192,87,47], fg:[255,255,255] } : { bg:[240,199,179], fg:[37,35,31] };
  return a>=1 ? { bg:[61,107,114], fg:[255,255,255] } : { bg:[188,211,211], fg:[37,35,31] };
}
function rgbCss(a){ return `rgb(${a[0]},${a[1]},${a[2]})`; }
function celdaEstilo(mode, cel, valor){
  if(valor==null) return null;
  if(mode==='puntaje'){ const n=scaleToNivel(valor); return { bg:PDFC.sema[n], fg:PDFC.semaText[n] }; }
  return brechaEstilo(valor);
}
function fmtCelda(mode, v){ if(v==null) return '—'; if(mode==='puntaje') return v.toFixed(1); return (v>0.049?'+':'')+(Math.abs(v)<0.05?'0.0':v.toFixed(1)); }
function cmpTable(e, comps, mode){
  const val = (m,i) => mode==='puntaje' ? m.celdas[i].score : brecha(m.celdas[i]);
  const prom = mode==='puntaje' ? e.promScore : e.promBrecha;
  const td = (v) => { const st = celdaEstilo(mode,null,v); return st ? `<td class="cmp-cell" style="background:${rgbCss(st.bg)};color:${rgbCss(st.fg)}">${fmtCelda(mode,v)}</td>` : `<td class="cmp-cell cmp-null">—</td>`; };
  return `
  <div class="card" style="margin-top:14px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
      <h4 style="margin:0;">Equipo de ${esc(e.jefe.nombre)}</h4>
      <span class="small-muted">${e.miembros.length} colaborador${e.miembros.length===1?'':'es'} · orden alfabético</span>
    </div>
    <div class="table-wrap"><table class="cmp-table">
      <thead><tr><th>Colaborador</th>${comps.map(c=>`<th title="${esc(c.nombreMostrado)}"><span>${esc(c.nombreMostrado)}</span></th>`).join('')}</tr></thead>
      <tbody>
        ${e.miembros.map(m=>`<tr><td class="cmp-name">${esc(m.nombre)}</td>${comps.map((c,i)=>td(val(m,i))).join('')}</tr>`).join('')}
        <tr class="cmp-avg"><td class="cmp-name">Promedio del equipo</td>${comps.map((c,i)=>td(prom[i])).join('')}</tr>
      </tbody>
    </table></div>
  </div>`;
}
function cmpLegend(mode){
  const sw = (rgb,label)=>`<span class="cmp-sw"><i style="background:${rgbCss(rgb)}"></i>${label}</span>`;
  return `<div class="card" style="margin-top:14px;"><div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center;">` + (mode==='puntaje'
    ? [1,2,3,4].map(n=>sw(PDFC.sema[n],NIVEL_LABEL[n])).join('')+'<span class="small-muted">Celdas con “—”: menos de 2 evaluadores por grupo o sin respuestas.</span>'
    : sw([192,87,47],'Se ve mejor de lo que lo ven (≥ +1.0)')+sw([240,199,179],'+0.5 a +1.0')+sw([238,243,243],'Alineado (±0.5)')+sw([188,211,211],'−0.5 a −1.0')+sw([61,107,114],'Se subestima (≤ −1.0)')
  ) + `</div><p class="small-muted" style="margin-top:10px;">Uso exclusivo para desarrollo de equipos. No usar para ranking, compensación ni promoción: comparar personas con un 360 sesga a los evaluadores de la siguiente ronda y debilita la promesa de anonimato.</p></div>`;
}
function tabComparativo(proy){

function pdfMatrixPage(c, e, comps, mode){
  const doc=c.doc;
  const val = (m,i) => mode==='puntaje' ? m.celdas[i].score : brecha(m.celdas[i]);
  const prom = mode==='puntaje' ? e.promScore : e.promBrecha;
  const titulo = mode==='puntaje' ? 'Puntaje ponderado por competencia (escala 1-5)' : 'Brecha: autoevaluación menos evaluación de otros (positivo = se ve mejor de lo que lo ven)';
  const n=comps.length, nameW=120, colW=Math.min(46,(c.cw-nameW)/n), headerH=106, rowH=17;
  let miembros=e.miembros.slice(), cont=false;
  while(true){
    if(cont){ doc.addPage(); c.y=c.mt; }
    pdfFont(doc,'bold',cont?11:15); pdfColor(doc,'text',PDFC.teal900);
    doc.text(pdfClean('Equipo de '+e.jefe.nombre+(cont?' (continuación)':'')),c.ml,c.y+(cont?11:13)); c.y+=cont?18:23;
    if(!cont) pdfPara(c,titulo+' · '+e.miembros.length+' colaborador'+(e.miembros.length===1?'':'es')+' · Orden alfabético',{size:9,color:PDFC.taupe,after:6});
    const cap = Math.max(1, Math.floor((c.H-c.mb-c.y-headerH-rowH-34)/rowH));
    const take = miembros.splice(0,cap), last = miembros.length===0;
    // encabezado rotado
    const top=c.y;
    pdfFont(doc,'bold',7); pdfColor(doc,'text',PDFC.teal900);
    comps.forEach((cm,i)=>{
      const x=c.ml+nameW+i*colW, lines=doc.splitTextToSize(pdfClean(cm.nombreMostrado),headerH-8).slice(0,2);
      const base=x+colW/2+(lines.length===2?-1:3);
      lines.forEach((ln,li)=>doc.text(ln,base+li*8,top+headerH-4,{angle:90}));
    });
    pdfFont(doc,'bold',8); doc.text('Colaborador',c.ml,top+headerH-6);
    c.y=top+headerH;
    pdfColor(doc,'draw',PDFC.teal700); doc.setLineWidth(1); doc.line(c.ml,c.y-1,c.ml+nameW+colW*n,c.y-1);
    const drawRow=(label,vals,bold,shade)=>{
      if(shade){ pdfColor(doc,'fill',PDFC.teal50); doc.rect(c.ml,c.y,nameW+colW*n,rowH,'F'); }
      pdfFont(doc,bold?'bold':'normal',8.4); pdfColor(doc,'text',PDFC.ink);
      doc.text(doc.splitTextToSize(pdfClean(label),nameW-6)[0],c.ml+2,c.y+11.5);
      vals.forEach((v,i)=>{
        const x=c.ml+nameW+i*colW, st=celdaEstilo(mode,null,v);
        if(st){ pdfColor(doc,'fill',st.bg); doc.rect(x+1,c.y+1.5,colW-2,rowH-3,'F'); pdfColor(doc,'text',st.fg); pdfFont(doc,'bold',7.6); doc.text(fmtCelda(mode,v),x+colW/2,c.y+11.2,{align:'center'}); }
        else { pdfColor(doc,'text',PDFC.taupeL); pdfFont(doc,'normal',8); doc.text('—',x+colW/2,c.y+11.2,{align:'center'}); }
      });
      c.y+=rowH;
    };
    take.forEach((m,k)=>drawRow(m.nombre, comps.map((cm,i)=>val(m,i)), false, k%2===1));
    if(last){
      pdfColor(doc,'draw',PDFC.teal700); doc.setLineWidth(.8); doc.line(c.ml,c.y,c.ml+nameW+colW*n,c.y);
      drawRow('Promedio del equipo', prom, true, false);
      c.y+=10;
      // leyenda
      let lx=c.ml; const items = mode==='puntaje'
        ? [1,2,3,4].map(k=>[PDFC.sema[k],NIVEL_LABEL[k]])
        : [[[192,87,47],'Se ve mejor (>= +1.0)'],[[240,199,179],'+0.5 a +1.0'],[[238,243,243],'Alineado (+/-0.5)'],[[188,211,211],'-0.5 a -1.0'],[[61,107,114],'Se subestima (<= -1.0)']];
      items.forEach(([rgb,lab])=>{ pdfColor(doc,'fill',rgb); doc.rect(lx,c.y,9,9,'F'); pdfFont(doc,'normal',7.6); pdfColor(doc,'text',PDFC.taupe); doc.text(pdfClean(lab),lx+13,c.y+7.5); lx+=13+doc.getTextWidth(pdfClean(lab))+16; });
      c.y+=16;
      pdfPara(c,'Uso exclusivo para desarrollo de equipos; no para ranking, compensación ni promoción. Celdas con "-": menos de 2 evaluadores por grupo o sin respuestas.',{size:7.8,color:PDFC.taupeL,style:'italic'});
      break;
    }
    cont=true;
  }
}
function buildComparativoPdf(proy){
  const cmp = computeComparativo(proy);
  let sel = STATE.cmpTeam || 'all';
  const equipos = cmp.equipos.filter(e=>sel==='all'||e.jefe.key===sel);
  if(!equipos.length) throw new Error('No hay equipos para exportar.');
  const c = pdfNew({ landscape:true, title:'Comparativo de colaboradores por jefe', sub:proy.nombre });
  let first=true;
  equipos.forEach(e=>['puntaje','brecha'].forEach(mode=>{
    if(!first){ c.doc.addPage(); c.y=c.mt; } first=false;
    pdfMatrixPage(c,e,cmp.comps,mode);
  }));
  pdfFinish(c);
  return { doc:c.doc, filename:'Comparativo_por_jefe_'+slugFile(proy.nombre)+'_'+new Date().toISOString().slice(0,10)+'.pdf' };
}
function comparativoPdf(mode){
  try{
    const b = buildComparativoPdf(findProyecto(STATE.proyectoId));
    if(mode==='preview') pdfPreview(b.doc,b.filename); else pdfDownload(b.doc,b.filename);
  }catch(e){ console.error(e); alert('No se pudo generar el PDF: '+(e&&e.message||e)); }
}
function comparativoExcel(){
  try{
    if(!window.XLSX) throw new Error('La librería de Excel no cargó. Recarga la página e inténtalo de nuevo.');
    const proy = findProyecto(STATE.proyectoId), cmp = computeComparativo(proy), sel = STATE.cmpTeam||'all';
    const equipos = cmp.equipos.filter(e=>sel==='all'||e.jefe.key===sel);
    const head = ['Jefe','Colaborador',...cmp.comps.map(c=>c.nombreMostrado)];
    const r2 = v => v==null ? '' : Math.round(v*100)/100;
    const a1=[head], a2=[head];
    equipos.forEach(e=>{
      e.miembros.forEach(m=>{ a1.push([e.jefe.nombre,m.nombre,...m.celdas.map(x=>r2(x.score))]); a2.push([e.jefe.nombre,m.nombre,...m.celdas.map(x=>r2(brecha(x)))]); });
      a1.push([e.jefe.nombre,'PROMEDIO DEL EQUIPO',...e.promScore.map(r2)]); a2.push([e.jefe.nombre,'PROMEDIO DEL EQUIPO',...e.promBrecha.map(r2)]);
    });
    const pm = pesosMap(proy);
    const notas = [['Proyecto',proy.nombre],['Generado',fechaLarga()],['Escala','1 a 5'],['Pesos por grupo',GROUPS.filter(g=>g!=='autoevaluacion').map(g=>GROUP_LABEL[g]+': '+(pm[g]||0)).join(' · ')],
      ['Regla de anonimato','Un grupo evaluador necesita al menos 2 evaluadores para contar; celdas vacías = datos insuficientes'],
      ['Brecha','Autoevaluación menos evaluación de otros (positivo = se ve mejor de lo que lo ven)'],
      ['Uso','Exclusivo para desarrollo de equipos; no para ranking, compensación ni promoción']];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a1), 'Puntajes');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a2), 'Brecha');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(notas), 'Notas');
    XLSX.writeFile(wb, 'Comparativo_por_jefe_'+slugFile(proy.nombre)+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
    toast('Excel generado.');
  }catch(e){ console.error(e); alert('No se pudo generar el Excel: '+(e&&e.message||e)); }
}

function catListaComp(){
  const items = CAT.competencias.filter(c=>verArch('cat')||!T(c.archivado)); const s = dictSearch(items, STATE.catQ||''); const lista = s ? s.res.map(r=>r.c) : items;
  if(!lista.length) return emptyState('Sin resultados.');
  return lista.map(c=>{ const na = CAT.acciones.filter(a=>a.competenciaId===c.id && !T(a.archivado)).length;
    return `<div class="checklist-row"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">${esc(c.nombre)} <span class="small-muted">· ${CATEGORY_LABEL[c.categoria]} · ${Object.keys(c.niveles).length} niveles · ${na} acciones</span> ${T(c.archivado)?'<span class="tag tag-arch">Archivada</span>':''}</div><div class="small-muted" style="white-space:normal">${esc((c.definicion||'').slice(0,170))}</div></div>
    <div class="row-actions"><button class="btn btn-ghost btn-sm" onclick="abrirCompetenciaMaestra('${c.id}')">Editar</button><button class="btn btn-ghost btn-sm" onclick="STATE.accComp='${c.id}';STATE.catTab='acciones';render()">Acciones</button>${archBtns('competencia',c)}</div></div>`; }).join('');
}
function abrirCompetenciaMaestra(id){
  const c = id ? CAT.competencias.find(x=>x.id===id) : {niveles:{}};
  abrirModal(modalHtml(id?'Editar competencia':'Nueva competencia', `<div class="field-row"><div class="field"><label>Nombre</label><input id="cm-n" value="${esc(c.nombre||'')}"/></div><div class="field" style="max-width:170px"><label>Categoría</label><select id="cm-c">${['A','B','C'].map(k=>`<option value="${k}" ${(c.categoria||'B')===k?'selected':''}>${CATEGORY_LABEL[k]}</option>`).join('')}</select></div></div>
    <div class="field"><label>Definición</label><textarea id="cm-d" rows="3">${esc(c.definicion||'')}</textarea></div><div class="field"><label>Nota de diferenciación (opcional)</label><textarea id="cm-nota" rows="2">${esc(c.notaDiferenciacion||'')}</textarea></div><hr class="sep"/>
    ${[1,2,3,4].map(n=>`<div class="field"><label><span class="sema sema-${n}" style="font-size:11px">${NIVEL_LABEL[n]}</span> Ancla conductual</label><input id="cm-a${n}" value="${esc((c.niveles[n]||{}).anclaConductual||'')}"/></div>
    <div class="field"><label>Comportamientos observables (uno por línea)</label><textarea id="cm-b${n}" rows="3">${esc(((c.niveles[n]||{}).comportamientos||[]).join('\n'))}</textarea></div>`).join('')}
    <p class="small-muted">Tras guardar, agrega sus acciones 70-20-10 en la pestaña «Acciones» (3 saltos de nivel × 4 acciones).</p>`,
    `${BTN_CANCEL}<button class="btn btn-primary" onclick="guardarCompetenciaMaestraUI('${id||''}')">Guardar</button>`, 'wide'));
}
function guardarCompetenciaMaestraUI(id){
  const niveles={}; [1,2,3,4].forEach(n=>niveles[n]={anclaConductual:val('cm-a'+n), comportamientos:val('cm-b'+n).split('\n')});
  accion('guardarCompetenciaMaestra',{id:id||undefined, nombre:val('cm-n'), categoria:val('cm-c'), definicion:val('cm-d'), notaDiferenciacion:val('cm-nota'), niveles}, 'Competencia guardada');
}
function catAcciones(){
  const comp = STATE.accComp||'', niv = STATE.accNiv||'', tipo = STATE.accTipo||'', q = normTxt(STATE.accQ||'');
  let l = CAT.acciones.filter(a=>(verArch('acc')||!T(a.archivado)) && (!comp||a.competenciaId===comp) && (!niv||String(a.nivelActual)===niv) && (!tipo||String(a.tipo)===tipo) && (!q||normTxt(a.actividad+' '+a.descripcion).includes(q)));
  const total = l.length; l = l.slice(0,80);
  const nombreC = id => { const c=CAT.competencias.find(x=>x.id===id); return c?c.nombre:id; };
  return `<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">
    <div class="field" style="margin:0;min-width:220px"><label>Competencia</label><select onchange="STATE.accComp=this.value;render()"><option value="">Todas</option>${CAT.competencias.map(c=>`<option value="${c.id}" ${comp===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    <div class="field" style="margin:0"><label>Salto</label><select onchange="STATE.accNiv=this.value;render()"><option value="">Todos</option>${[1,2,3].map(n=>`<option value="${n}" ${niv==String(n)?'selected':''}>${n} → ${n+1}</option>`).join('')}</select></div>
    <div class="field" style="margin:0"><label>Tipo</label><select onchange="STATE.accTipo=this.value;render()"><option value="">Todos</option>${[70,20,10].map(t=>`<option value="${t}" ${tipo==String(t)?'selected':''}>${t}%</option>`).join('')}</select></div>
    <div class="field" style="margin:0;flex:1;min-width:180px"><label>Buscar texto</label><input value="${esc(STATE.accQ||'')}" onchange="STATE.accQ=this.value;render()"/></div>
    ${toggleArchHtml('acc')}<button class="btn btn-primary" onclick="abrirAccion()">+ Nueva acción</button></div>
    <p class="small-muted">${total} acciones${total>80?' (se muestran las primeras 80: usa los filtros)':''}.</p>
    ${l.map(a=>`<div class="sug" style="align-items:center"><div><span class="pill pill${a.tipo}">${a.tipo}%</span> <strong>${esc(a.actividad)}</strong> ${T(a.archivado)?'<span class="tag tag-arch">Archivada</span>':''}<div class="mini">${esc(nombreC(a.competenciaId))} · salto ${a.nivelActual} → ${a.nivelObjetivo} · ${esc(a.plazo)}</div><div class="mini" style="white-space:normal">${esc(a.descripcion)}</div></div>
      <div class="row-actions"><button class="btn btn-ghost btn-sm" onclick="abrirAccion('${a.id}')">Editar</button>${archBtns('accion',a)}</div></div>`).join('')||emptyState('Sin acciones con esos filtros.')}</div>`;
}
function abrirAccion(id){
  const a = id ? CAT.acciones.find(x=>x.id===id) : {competenciaId:STATE.accComp||CAT.competencias[0].id, nivelActual:Number(STATE.accNiv)||1, tipo:Number(STATE.accTipo)||70, plazo:PLAZOS[0]};
  abrirModal(modalHtml(id?'Editar acción':'Nueva acción', `<div class="field"><label>Competencia</label><select id="ac-c">${CAT.competencias.filter(c=>!T(c.archivado)||c.id===a.competenciaId).map(c=>`<option value="${c.id}" ${a.competenciaId===c.id?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    <div class="field-row"><div class="field"><label>Salto de nivel</label><select id="ac-n">${[1,2,3].map(n=>`<option value="${n}" ${Number(a.nivelActual)===n?'selected':''}>${n} → ${n+1}</option>`).join('')}</select></div>
    <div class="field"><label>Tipo</label><select id="ac-t" onchange="document.getElementById('ac-10').style.display=this.value==='10'?'block':'none'">${[70,20,10].map(t=>`<option value="${t}" ${Number(a.tipo)===t?'selected':''}>${TIPO_LABEL[t]}</option>`).join('')}</select></div></div>
    <div class="field"><label>Actividad (infinitivo impersonal: Registrar…, Preparar…)</label><input id="ac-a" value="${esc(a.actividad||'')}"/></div>
    <div class="field"><label>¿En qué consiste? (lenguaje sencillo)</label><textarea id="ac-d" rows="3">${esc(a.descripcion||'')}</textarea></div>
    <div class="field"><label>Plazo</label><select id="ac-p">${PLAZOS.map(p=>`<option ${a.plazo===p?'selected':''}>${p}</option>`).join('')}</select></div>
    <div id="ac-10" style="display:${Number(a.tipo)===10?'block':'none'}"><div class="field"><label>Objetivos de aprendizaje</label><textarea id="ac-o" rows="2">${esc(a.objetivosAprendizaje||'')}</textarea></div>
    <div class="field-row"><div class="field"><label>Plataforma</label><input id="ac-pl" value="${esc(a.plataforma||'')}"/></div><div class="field"><label>Enlace de búsqueda (https://)</label><input id="ac-e" value="${esc(a.enlaceBusqueda||'')}"/></div></div>
    <div class="field-hint">Usa URLs de búsqueda de la plataforma (no de un curso puntual): los cursos cambian o se retiran.</div></div>`,
    `${BTN_CANCEL}<button class="btn btn-primary" onclick="guardarAccionUI('${id||''}')">Guardar</button>`, 'wide'));
}
function guardarAccionUI(id){
  accion('guardarAccion',{id:id||undefined, competenciaId:val('ac-c'), nivelActual:Number(val('ac-n')), tipo:Number(val('ac-t')), actividad:val('ac-a'), descripcion:val('ac-d'), plazo:val('ac-p'), objetivosAprendizaje:val('ac-o'), plataforma:val('ac-pl'), enlaceBusqueda:val('ac-e'), activa:true},'Acción guardada');
}
function catImportar(){
  return `<div class="card"><h4>Catálogo inicial de Elevate</h4>
    <p>El catálogo actual tiene <strong>${CAT.competencias.length}</strong> competencias y <strong>${CAT.acciones.length}</strong> acciones.</p>
    <p>Este botón agrega lo que falte del catálogo inicial incluido en la aplicación (<strong>${SEED_MAESTRO.length}</strong> competencias y <strong>${SEED_ACCIONES.length}</strong> acciones, borrador pendiente de tu revisión). <strong>No sobrescribe nada de lo que ya editaste</strong> y es seguro repetirlo. Además migra a versión 1 los diccionarios que los clientes tenían en la versión anterior de la herramienta.</p>
    <button class="btn btn-primary" onclick="accion('importarCatalogo',{competencias:SEED_MAESTRO,acciones:SEED_ACCIONES},null,{cerrarModal:false,sinRender:true}).then(r=>{ if(r){ resumenModal('Importación completada',[\`<strong>\${r.competencias}</strong> competencias y <strong>\${r.acciones}</strong> acciones agregadas.\`,\`<strong>\${r.versionesMigradas}</strong> diccionarios de clientes migrados a versión 1 · <strong>\${r.proyectosVinculados}</strong> proyectos vinculados.\`]); } })">Importar catálogo inicial</button></div>`;
}

/* ================= EVALUACIÓN PÚBLICA (enlace único; solo recibe datos de esa asignación) ================= */
const EVAL_CACHE = {};
async function cargarEval(token){
  try{
    const u = new URL(CONFIG.API_URL); u.searchParams.set('action','evalByToken'); u.searchParams.set('token',token);
    const r = await fetch(u.toString()); EVAL_CACHE[token] = await r.json();
  }catch(e){ EVAL_CACHE[token] = {error:'No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.'}; }
  render();
}
function renderEval(token){
  const app=$('app');
  if(!(token in EVAL_CACHE)){ app.innerHTML=`<div class="center-screen"><div class="auth-card"><p>Cargando tu evaluación…</p></div></div>`; cargarEval(token); return; }
  const d = EVAL_CACHE[token];
  const volver = DB ? `<button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="location.hash='';render()">Volver al panel</button>` : '';
  if(!d || d.error) { app.innerHTML=`<div class="center-screen"><div class="auth-card"><h3>Enlace no disponible</h3><p>${esc((d&&d.error)||'Este enlace no es válido.')}</p>${volver}</div></div>`; return; }
  if(d.completado){ app.innerHTML=`<div class="center-screen"><div class="auth-card"><img src="${LOGO_SRC}" style="width:44px;margin-bottom:10px"/><h3>¡Gracias!</h3><p>Ya registramos tu evaluación para ${esc(d.evaluadoNombre)}.</p>${volver}</div></div>`; return; }
  app.innerHTML = `<div class="center-screen" style="align-items:flex-start"><div class="auth-card" style="max-width:640px;text-align:left;margin-top:20px">
    <div class="auth-logo"><img src="${LOGO_SRC}"/><div><div class="auth-title">Evaluación 360°</div><div class="small-muted">${esc(d.proyectoNombre)}</div></div></div>
    <p>Estás evaluando a <strong>${esc(d.evaluadoNombre)}</strong> como <strong>${esc(d.grupoLabel)}</strong>. Califica cada competencia de 1 (básico) a 5 (referente). Tus respuestas se agrupan con las de otras personas y no se muestran de forma individual${d.grupo==='jefe'?' (salvo la del jefe directo, que es identificable por naturaleza)':''}.</p>
    <form onsubmit="return enviarEval(event,'${esc(token)}')">
    ${d.competencias.map(c=>`<div class="field" style="border-top:1px solid var(--line);padding-top:14px"><label style="font-size:14px">${esc(c.nombre)}</label>
      <div style="display:flex;gap:6px;margin:6px 0 4px">${[1,2,3,4,5].map(n=>`<label style="flex:1;text-align:center;background:var(--teal-50);border:1px solid var(--teal-200);border-radius:8px;padding:8px 0;font-size:13px;font-weight:700;cursor:pointer"><input type="radio" name="sc-${esc(c.id)}" value="${n}" required style="display:block;margin:0 auto 4px"/>${n}</label>`).join('')}</div><div class="field-hint">1 = básico · 5 = referente</div></div>`).join('')}
    <div class="field" style="border-top:1px solid var(--line);padding-top:14px"><label>Comentario abierto (opcional)</label><textarea id="ev-com" rows="3" placeholder="Ejemplos concretos de comportamientos observados…"></textarea></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" type="submit">Enviar evaluación</button></form>${volver}</div></div>`;
}
async function enviarEval(ev, token){
  ev.preventDefault(); const d=EVAL_CACHE[token], respuestas={};
  d.competencias.forEach(c=>{ const r=document.querySelector(`input[name="sc-${CSS.escape(c.id)}"]:checked`); if(r) respuestas[c.id]=Number(r.value); });
  const btn=ev.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Enviando…';
  try{
    const r = await api({action:'submitEval', token, respuestas, comentario:val('ev-com')}, false);
    if(r.error){ toast(r.error, true); btn.disabled=false; btn.textContent='Enviar evaluación'; return false; }
    delete EVAL_CACHE[token]; render();
  }catch(e){ toast(e.message, true); btn.disabled=false; btn.textContent='Enviar evaluación'; }
  return false;
}

/* ================= ARRANQUE ================= */
async function boot(){
  window.addEventListener('hashchange', render);
  if(location.hash.startsWith('#/eval/')){ render(); return; }
  const t = leerSes();
  if(t){ STATE.ses=t; try{ await cargarTodo(); defaultRoute(); }catch(e){ guardarSes(null); DB=null; } }
  render();
}
boot();

</script></body></html>
